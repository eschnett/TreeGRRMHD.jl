# Performance before production: how many ranks a node should hold. The DD2 star
# (`bin/benchmark.jl case=dd2`) on 960 blocks (`[−24, 24]³`, 4³ roots of 16³, two box
# levels, 3.9·10⁶ cells), one Zen 3 node (EPYC 7543, 8 NUMA domains), 64 cores as 1, 2, 4
# and 8 ranks, each bound to its share of the domains; the runs one after another.
name = "perf-mpi-node"
mode = "sequential"
placement = "numa"
vars = { ENTROPYEOS_TABLE_DIR = "/mnt/beegfs/eschnetter/EOS" }

[site.symmetry]
node = "cn096"
time = "2:00:00"

[[run]]
label = "r1"
cmd = "bin/benchmark.jl case=dd2 L=24 roots=4 levels=2 reps=3 mpi=true"
ranks = 1
threads = 64

[[run]]
label = "r2"
cmd = "bin/benchmark.jl case=dd2 L=24 roots=4 levels=2 reps=3 mpi=true"
ranks = 2
threads = 32

[[run]]
label = "r4"
cmd = "bin/benchmark.jl case=dd2 L=24 roots=4 levels=2 reps=3 mpi=true"
ranks = 4
threads = 16

[[run]]
label = "r8"
cmd = "bin/benchmark.jl case=dd2 L=24 roots=4 levels=2 reps=3 mpi=true"
ranks = 8
threads = 8
