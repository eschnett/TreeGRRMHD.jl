name: CI

# Two tiers, the same in every Tree* repository. A pull request runs the
# Linux cells only, uninstrumented: the full suite has already run on the
# author's machine (macOS, arm64), so what CI adds there is x86-64 Linux,
# a clean environment and bounds checks. A push to `main`, the weekly
# schedule and a manual dispatch run the whole matrix, macOS and coverage
# included. Tags are not tested: a release tags a commit that has passed
# on `main`.
#
# The suite runs in tiers (`test/tiers.jl`, 2026-11-08, after
# TreeGeneralizedHarmonic's): the one-thread cells run the *quick* tier,
# everything but the finest curved runs and the 1000-step uniform flows; the
# four-thread cell the *threaded* tier, the quick tier less the 1D studies,
# which took most of its 32 minutes (4-8 times their one-thread time on these
# runners) and exercise no threaded path the 2D and 3D runs do not. The full
# suite runs on the workstation and on Symmetry before a pull request,
# reported on the commit as a `full-suite/<host>` status by `ci/full-suite.sh`;
# the weekly schedule runs it here too, off anyone's critical path, and a
# manual dispatch takes the tier as an input.
on:
  # A Markdown-only change cannot move a measured number.
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  # Weekly, for what changes without a push here: the registry, and the
  # dependencies taken from `main` through `[sources]`. The Tree*
  # repositories are staggered by 20 minutes so that their macOS cells do
  # not queue behind each other (five run at once per account).
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      tier:
        description: "The test tier: quick (threaded at four threads), or full"
        type: choice
        options: [quick, full]
        default: quick

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.threads }} thread(s)
    runs-on: ${{ matrix.os }}
    # A guard against a runtime regression, not a budget, sized for the full
    # tier. Raised from 30 to 60 on 2026-11-05: the 4-thread cell took 26
    # minutes on 2026-10-16 and timed out twice on PR 2, while the 1-thread
    # cells take 12-13 minutes. The threaded cell is 2.5x slower overall and
    # up to 12x slower on the small, many-step 1D runs (Alfvén wave, PPM: 44 s
    # at one thread, 273 s at four), which looks like per-launch threading
    # overhead on a shared 4-vCPU runner; the threaded tier leaves those runs
    # out, and the cause is still not measured.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # One cell per axis: macOS/arm64, Linux, and threads, all at Julia
      # 1.13. It is the floor, and the only version tested: every Tree*
      # package raised its floor to 1.13 on 2026-10-16, because supporting
      # older versions slows development and is not useful at the moment
      # (see "Julia version" in `CODE.md`).
      matrix:
        version: ["1.13"]
        # macOS/arm64 only off pull requests (see `on:` above).
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macOS-latest"]') }}
        # `threads` is a matrix key, so that the threaded entry below
        # overwrites it and adds a cell; an entry that only added the key
        # would merge into the serial Linux cell instead.
        threads: [1]
        include:
          # Threaded. Never instrument this one: a coverage hit is an
          # atomic increment on one counter per line, so threads running
          # the same kernel contend on one cache line -- TreeHydro measured
          # 100x.
          - version: "1.13"
            os: ubuntu-latest
            threads: 4
    # arm64 carries the coverage: one instrumented cell, and only off pull
    # requests. Instrumented at 1.13 the suite took 1.24x (6m27s against
    # 5m12s, both with bounds checks, 2026-10-15). A condition here rather
    # than a `coverage` key in the matrix: a pull request's matrix has no
    # macOS cell, and an include entry that matches none adds one.
    env:
      # `full` on the weekly schedule and when a dispatch asks for it;
      # otherwise `threaded` on the four-thread cell and `quick` on the others.
      TREEGRRMHD_TEST_TIER: ${{ (github.event.inputs.tier == 'full' || github.event_name == 'schedule') && 'full' || (matrix.threads == 4 && 'threaded' || 'quick') }}
      COVERAGE: ${{ matrix.os == 'macOS-latest' && matrix.threads == 1 && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      # EntropyEOS (until EOS-0) and IMEXRungeKutta are not in the General
      # registry. They are added by URL through `Project.toml`'s `[sources]`
      # rather than by a `Pkg.add(url = ...)` step here, so that CI, a clean
      # checkout and a developer's `Pkg.instantiate()` resolve them the same
      # way, from their remotes and never from a sibling checkout (see
      # "Upstream prerequisites" in `CODE.md`).
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          # One cell, and only where the badge reads it (`env` above). The
          # dispatch arm keeps the upload path exercisable from a branch.
          coverage: ${{ env.COVERAGE }}
          # Explicit, as in TreeAMR and TreeHydro: the kernels will carry
          # `@inbounds`, and `--check-bounds=yes` is the only thing that
          # falsifies the index arithmetic it asserts. It is already this
          # action's default; the point is that a default which silently
          # changed would turn an unchecked `@inbounds` into memory
          # corruption rather than a test failure.
          check_bounds: 'yes'
        env:
          # Every number the suite asserts must be identical at one thread
          # and at four.
          JULIA_NUM_THREADS: ${{ matrix.threads }}
      - uses: julia-actions/julia-processcoverage@v1
        if: env.COVERAGE == 'true'
      - uses: codecov/codecov-action@v7
        if: env.COVERAGE == 'true'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          # A Codecov outage should not turn a green test run red.
          fail_ci_if_error: false
