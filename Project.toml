name = "TreeGRRMHD"
uuid = "f3727fb5-afac-43cc-bb8c-9034b99ae834"
version = "0.1.0"
authors = ["Erik Schnetter <schnetter@gmail.com>"]

[deps]
Adapt = "79e6a3ab-5dfb-504d-930d-738a2a938a0e"
EntropyEOS = "75b96802-7bb2-4b1d-85f8-8113624a580e"
IMEXRungeKutta = "6f46d5f7-e15e-41aa-a098-eed9d1a63ad8"
KernelAbstractions = "63c18a36-062a-441e-b654-da1e3ab1ce7c"
SpacetimeMetrics = "77e61b41-605e-43a6-b70f-04b7dcd1f572"
StaticArrays = "90137ffa-7385-5640-81b9-e52037218182"
TreeAMR = "91bc416d-811c-44c1-9bc4-b9c8bbdbbd08"
TreeIOHDF5 = "49af10b2-b28a-4989-bafa-527ac30d3246"

# EntropyEOS (until EOS-0) and IMEXRungeKutta are not in the General
# registry, so a clean clone finds them here, from their remotes and never
# from a sibling checkout; TreeAMR and SpacetimeMetrics are, and need no
# entry. `[sources]` is a 1.11 feature, below the Julia floor (1.13; see
# "Julia version" in `CODE.md`). IMEXRungeKutta 1.4 is the release the
# plan's steps 4a–4c ended at. EntropyEOS is pinned to a tag, `v2.3.0` since
# step 13 (below); since `v2.2.1` (2bb2d56, 2026-10-30) it has the two-level
# projection (`con2prim_safe` onto `ProjectionOptions`, `apply_policy` with
# `PolicyOptions`), the face flags, EOS-8 and EOS-9 (2.0.0), `inside_window`,
# the reconstruction's validity test (2.1.0, EOS-11), and the search confined
# to the density box and the sound-speed flags (2.2.0), and the nested
# fallback allocation-free under bounds checks (2.2.1, EOS-10) ("Primitive
# recovery" in `CODE.md`). Before 2026-10-30 the tag was `v2.2.0`, before
# 2026-10-26 `v2.0.0`, and before 2026-10-24 `v1.1.0`. Since 2026-11-20
# (step 13) it is `v2.3.0` (542c32c, the merge of EntropyEOS's PR 15, whose
# tree is its head 1e324e4): the cold β-equilibrium slice (EOS-4).
[sources]
EntropyEOS = {url = "https://github.com/eschnett/EntropyEOS.jl", rev = "v2.3.0"}
IMEXRungeKutta = {rev = "main", url = "https://github.com/eschnett/IMEXRungeKutta.jl"}

[compat]
Adapt = "4"
EntropyEOS = "2.3"
IMEXRungeKutta = "1.4"
KernelAbstractions = "0.9.42"
SpacetimeMetrics = "1.7"
StaticArrays = "1"
TreeAMR = "0.2.11"
TreeIOHDF5 = "0.1.10"
julia = "1.13"
