name = "TreeGRRMHD"
uuid = "f3727fb5-afac-43cc-bb8c-9034b99ae834"
version = "0.1.0"
authors = ["Erik Schnetter <schnetter@gmail.com>"]

[deps]
Adapt = "79e6a3ab-5dfb-504d-930d-738a2a938a0e"
EntropyEOS = "75b96802-7bb2-4b1d-85f8-8113624a580e"
IMEXRungeKutta = "6f46d5f7-e15e-41aa-a098-eed9d1a63ad8"
KernelAbstractions = "63c18a36-062a-441e-b654-da1e3ab1ce7c"
SpacetimeMetrics = "77e61b41-605e-43a6-b70f-04b7dcd1f572"
StaticArrays = "90137ffa-7385-5640-81b9-e52037218182"
TreeAMR = "91bc416d-811c-44c1-9bc4-b9c8bbdbbd08"
TreeIOHDF5 = "49af10b2-b28a-4989-bafa-527ac30d3246"

# IMEXRungeKutta is not in the General registry, so a clean clone finds it
# here, from its remote and never from a sibling checkout; TreeAMR,
# SpacetimeMetrics and EntropyEOS are, and need no entry. `[sources]` is a
# 1.11 feature, below the Julia floor (1.13; see "Julia version" in
# `CODE.md`). IMEXRungeKutta 1.4 is the release the plan's steps 4a–4c ended
# at. EntropyEOS 2.3 is the first release with the cold β-equilibrium slice
# (EOS-4), which step 13 needs; 2.4.2 the first whose warm `evaluate`
# samples its bracket's ends only when needed (EOS-14), and 2.4.3 the first
# with `s_width_bound`, which `GeometricEOS` forwards; the tabulated star's
# cost assumes both. 2.5 exports `policy_decides` and `policy_atmosphere`
# (EOS-15), with which the recovery skips level 1 in the atmosphere
# ("Upstream prerequisites" in `CODE.md`).
[sources]
IMEXRungeKutta = {rev = "main", url = "https://github.com/eschnett/IMEXRungeKutta.jl"}

[compat]
Adapt = "4"
EntropyEOS = "2.5"
IMEXRungeKutta = "1.4"
KernelAbstractions = "0.9.42"
SpacetimeMetrics = "1.7"
StaticArrays = "1"
TreeAMR = "0.2.11"
TreeIOHDF5 = "0.1.10"
julia = "1.13"
